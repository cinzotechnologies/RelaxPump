<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CINZO IOT theme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:-apple-system,'SF Pro Text',Inter,system-ui,sans-serif;color:#E8F6F7}
a{color:#7FE3EC}a:hover{color:#B5F1F6}
</style>
</helmet>
<div style="width: 600px; height: 844px; box-sizing: border-box; background: #021A20; padding: 40px; display: flex; flex-direction: column; gap: 32px; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; color: #E8F6F7">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; align-items: center; gap: 10px"><svg width="32" height="32" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 5C24 5 11 19.5 11 29a13 13 0 0 0 26 0C37 19.5 24 5 24 5Z" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round"></path><path d="M15.5 31q4.25-4 8.5 0t8.5 0" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"></path></svg><span style="font-size: 22px; color: #FFFFFF"><span style="font-weight: 300">Relax</span><span style="font-weight: 700">Pump</span></span></div>
    <span style="font-size: 13px; color: #8FB3B8">IOT · Theme v3</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px">
    <div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 76px; border-radius: 18px; background: #021A20; box-shadow: inset 0 0 0 1px rgba(127,227,236,0.25)"></div><span style="font-size: 12px; font-weight: 600">Base</span><span style="font-size: 11px; color: #8FB3B8">#021A20</span></div>
    <div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 76px; border-radius: 18px; background: #0A242B"></div><span style="font-size: 12px; font-weight: 600">Card</span><span style="font-size: 11px; color: #8FB3B8">#0A242B</span></div>
    <div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 76px; border-radius: 18px; background: #035360"></div><span style="font-size: 12px; font-weight: 600">Teal</span><span style="font-size: 11px; color: #8FB3B8">#035360</span></div>
    <div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 76px; border-radius: 18px; background: #037788"></div><span style="font-size: 12px; font-weight: 600">Light teal</span><span style="font-size: 11px; color: #8FB3B8">#037788</span></div>
    <div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 76px; border-radius: 18px; background: #7FE3EC; box-shadow: 0 0 24px rgba(127,227,236,0.45)"></div><span style="font-size: 12px; font-weight: 600">Glow</span><span style="font-size: 11px; color: #8FB3B8">#7FE3EC</span></div>
  </div>

  <div style="height: 120px; border-radius: 30px; background: radial-gradient(140% 100% at 20% 0%, #0A9AAE 0%, #037788 40%, #035360 100%)"></div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 52px; font-weight: 700; letter-spacing: -1.5px; line-height: 1">68%</span>
    <span style="font-size: 20px; font-weight: 700">Rooftop</span>
    <span style="font-size: 15px">Tank 2</span>
    <span style="font-size: 13px; color: #8FB3B8">Caption</span>
  </div>

  <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap">
    <button style="height: 56px; padding: 0 28px; border-radius: 28px; border: 0; background: #7FE3EC; color: #021A20; font-size: 16px; font-weight: 700; font-family: inherit; box-shadow: 0 0 26px rgba(127,227,236,0.4)">Primary</button>
    <button style="height: 56px; padding: 0 28px; border-radius: 28px; border: 0; background: #0A242B; color: #E8F6F7; font-size: 16px; font-weight: 700; font-family: inherit; box-shadow: inset 0 0 0 1px rgba(127,227,236,0.3)">Secondary</button>
    <button aria-label="On" style="position: relative; width: 52px; height: 32px; border-radius: 16px; border: 0; padding: 0; background: #7FE3EC; box-shadow: 0 0 16px rgba(127,227,236,0.45)"><span style="position: absolute; top: 4px; left: 24px; width: 24px; height: 24px; border-radius: 12px; background: #021A20"></span></button>
    <button aria-label="Off" style="position: relative; width: 52px; height: 32px; border-radius: 16px; border: 0; padding: 0; background: rgba(255,255,255,0.15)"><span style="position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF"></span></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":600,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
