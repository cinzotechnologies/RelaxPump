<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RelaxPump app v2 — Tanks</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Outfit:wght@300;500;600&amp;display=swap">
<style>
body{margin:0;background:#021A20}
.ph{position:relative;width:390px;height:844px;overflow:hidden;background:#021A20;color:#E8F6F7;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.ph *{box-sizing:border-box}
.ph p{margin:0}
.sc{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding:0 0 120px}
.sc::-webkit-scrollbar{display:none}
.pad{padding:56px 16px 0}
.ttl{font:500 26px/1.1 Outfit,sans-serif;letter-spacing:-.3px}
.mut{color:#8FB3B8}
.card{background:#0A242B;border-radius:22px}
.lbl{font:600 11px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#7FE3EC}
.press{transition:transform .14s cubic-bezier(.22,1,.36,1);touch-action:manipulation;cursor:pointer}
.press:active{transform:scale(.96)}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border:0;border-radius:999px;background:linear-gradient(90deg,#A8F3F8,#7FE3EC,#2FB6C6);color:#021A20;font:600 15px/1 Inter,sans-serif}
.cta[disabled]{opacity:.45;cursor:not-allowed}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:999px;border:1px solid rgba(127,227,236,.4);background:transparent;color:#7FE3EC;font:600 13px/1 Inter,sans-serif}
.seg{display:grid;height:42px;padding:4px;border-radius:999px;background:#06171C}
.seg button{border:0;border-radius:999px;background:transparent;color:#8FB3B8;font:600 13px/1 Inter,sans-serif}
.seg button.on{background:#037788;color:#FFFFFF}
.sw{position:relative;width:46px;height:28px;flex-shrink:0;border:0;padding:0;border-radius:999px;background:#2A4A50;transition:background-color .25s}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#FFFFFF;transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.sw.on{background:#037788}
.sw.on i{transform:translateX(18px)}
.nav{position:absolute;left:12px;right:12px;bottom:16px;height:62px;border-radius:22px;background:rgba(6,23,28,.96);border:1px solid rgba(3,119,136,.7);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;justify-items:center;z-index:20}
.navc{margin-top:-28px;width:54px;height:54px;border-radius:50%;background:#0A242B;border:1.5px solid #037788;display:flex;align-items:center;justify-content:center}
.fade{animation:fu .5s cubic-bezier(.22,1,.36,1) both}
@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tc{border-radius:18px;background:#0A242B;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.g{position:relative;width:56px;border-radius:14px;overflow:hidden;background:#06171C;border:1px solid rgba(127,227,236,.18)}
.g i{position:absolute;left:0;right:0;bottom:0;transition:height .9s cubic-bezier(.22,1,.36,1)}
.g.dash{border:1.5px dashed rgba(143,179,184,.5);display:flex;align-items:center;justify-content:center}
.vb{height:24px;padding:0 10px;border:0;border-radius:999px;font:600 10px/24px Inter,sans-serif}
.v-open{background:#7FE3EC;color:#021A20}
.v-closed{background:rgba(184,205,208,.12);color:#B8CDD0}
.mainc{display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;background:#0A242B}
.hb{flex-grow:1;height:46px;border-radius:12px;overflow:hidden;background:#06171C;border:1px solid rgba(127,227,236,.18);position:relative}
.hb i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#037788,#7FE3EC)}
.track{position:relative;height:4px;border-radius:4px;background:rgba(127,227,236,.15)}

</style>
</helmet>
<div class="ph">
<div class="sc"><div class="pad" style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between"><span class="ttl">Tanks</span><span class="ghost press" style="height: 34px">Setup</span></div>
<div class="seg" style="grid-template-columns: repeat({{segCols}}, minmax(0, 1fr))">
<sc-for list="{{sources}}" as="o" hint-placeholder-count="3"><button class="press {{o.cls}}" type="button" onClick="{{o.go}}">{{o.label}}</button></sc-for>
</div>
<sc-if value="{{hasMain}}" hint-placeholder-val="{{ true }}">
<div class="mainc fade">
<span style="display: flex; flex-direction: column; gap: 3px; min-width: 86px"><span class="lbl">Main tank</span><span style="font-family: Outfit, sans-serif; font-size: 24px; font-weight: 500">72%</span><span style="font-size: 11px" class="mut">5,000 L</span></span>
<div class="hb"><i style="width: 72%"></i><span style="position: absolute; left: 10%; top: 0; bottom: 0; border-left: 1px dashed rgba(245,158,11,0.7)"></span></div>
</div>
</sc-if>
<div class="grid">
<sc-for list="{{tanks}}" as="t" hint-placeholder-count="4">
<div class="tc fade" style="animation-delay: {{t.delay}}">
<span style="font-size: 11px; font-weight: 600" class="mut">{{t.name}}</span>
<sc-if value="{{t.hasSensor}}" hint-placeholder-val="{{ true }}"><div class="g" style="height: {{gh}}"><i style="height: {{t.h}}; background: {{t.fill}}"></i><span style="position: absolute; left: 4px; right: 4px; top: 6px; border-top: 1px dashed rgba(232,246,247,0.45)"></span></div><span style="font-family: Outfit, sans-serif; font-size: 17px; font-weight: 500">{{t.pct}}%</span></sc-if>
<sc-if value="{{t.noSensor}}" hint-placeholder-val="{{ false }}"><div class="g dash" style="height: {{gh}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8FB3B8" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 7v6 M12 17h.01"></path></svg></div><span style="font-size: 11px; font-weight: 600" class="mut">No sensor</span></sc-if>
<sc-if value="{{t.hasValve}}" hint-placeholder-val="{{ true }}"><button class="vb press {{t.vCls}}" type="button" onClick="{{t.tap}}">{{t.vLabel}}</button></sc-if>
</div>
</sc-for>
</div>
<div class="card" style="padding: 14px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; justify-content: space-between"><span style="font-size: 14px; font-weight: 600">Auto mode</span><button class="sw press {{autoCls}}" type="button" aria-label="Auto mode" onClick="{{toggleAuto}}"><i></i></button></div>
<div style="display: flex; justify-content: space-between; font-size: 12px"><span class="mut">Start below</span><b>30%</b></div>
<div class="track"><div style="width: 30%; height: 4px; border-radius: 4px; background: #7FE3EC"></div></div>
<div style="display: flex; justify-content: space-between; font-size: 12px"><span class="mut">Stop at</span><b>95%</b></div>
<div class="track"><div style="width: 95%; height: 4px; border-radius: 4px; background: #7FE3EC"></div></div>
<sc-if value="{{hasNoSensor}}" hint-placeholder-val="{{ false }}"><p style="font-size: 12px; line-height: 1.5" class="mut">Tanks without a sensor are not in Auto. Tap Fill to run them on a timer.</p></sc-if>
</div>
<button class="cta press" type="button" onClick="{{togglePump}}">{{pumpLabel}}</button>
</div></div>
<div class="nav">
<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#5E7C81" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>
<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#7FE3EC" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 6c0-1.7 3.1-3 7-3s7 1.3 7 3v12c0 1.7-3.1 3-7 3s-7-1.3-7-3z M5 6c0 1.7 3.1 3 7 3s7-1.3 7-3"></path></svg>
<div class="navc"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7FE3EC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7l10 10-5 4V3l5 4L7 17"></path></svg></div>
<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#5E7C81" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V10 M12 20V4 M19 20v-7"></path></svg>
<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#5E7C81" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M4 21a8 8 0 0 1 16 0"></path></svg>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tanks":{"editor":"range","min":1,"max":8,"step":1,"default":5},"phe":{"editor":"boolean","default":true},"main":{"editor":"boolean","default":true},"noSensorTank":{"editor":"int","min":0,"max":8,"default":3},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { src: 'auto', open: 1, auto: true, pump: true, timer: -1 }; }
  renderVals() {
    const NAMES = ['Roof', 'Kitchen', 'Bathroom', 'Garden', 'Guest', 'Office', 'Store', 'Terrace'];
    const PCTS = [82, 46, 18, 64, 90, 35, 55, 27];
    const LIT = [1000, 500, 500, 1000, 500, 1000, 1000, 500];
    const s = this.state;
    const n = Math.max(1, Math.min(8, this.props.tanks ?? 5));
    const phe = this.props.phe ?? true, main = this.props.main ?? true, ns = this.props.noSensorTank ?? 3;
    const tanks = Array.from({ length: n }, (_, i) => {
      const noS = (i + 1) === ns, pct = PCTS[i];
      const hasValve = n > 1;
      const open = noS ? s.timer === i : s.open === i;
      return {
        name: NAMES[i], pct, h: pct + '%', delay: (i * 40) + 'ms', hasSensor: !noS, noSensor: noS, hasValve,
        fill: pct < 25 ? 'linear-gradient(180deg, #FCD34D, #D97706)' : 'linear-gradient(180deg, #7FE3EC, #037788)',
        vCls: open ? 'v-open' : 'v-closed',
        vLabel: noS ? (open ? 'Stop' : 'Fill 10 min') : (open ? 'Open' : 'Closed'),
        tap: () => noS ? this.setState({ timer: open ? -1 : i }) : this.setState({ open: open ? -1 : i })
      };
    });
    const opts = [{ k: 'auto', label: 'Auto' }].concat(phe ? [{ k: 'phe', label: 'PHE only' }] : []).concat([{ k: 'pump', label: 'Pump only' }]);
    return {
      tanks, gh: n <= 3 ? '120px' : '84px', hasMain: main, hasNoSensor: tanks.some(t => t.noSensor),
      sources: opts.map(o => ({ label: o.label, cls: s.src === o.k ? 'on' : '', go: () => this.setState({ src: o.k }) })), segCols: opts.length,
      autoCls: s.auto ? 'on' : '', toggleAuto: () => this.setState({ auto: !s.auto }),
      pumpLabel: s.pump ? 'Stop filling' : 'Start filling', togglePump: () => this.setState({ pump: !s.pump })
    };
  }
}
</script>
</body>
</html>
