; RelaxPump controller firmware — ONE build for Household and PHE boards (docs/two-module-system.md).
; Per-device values (id, password, claim code, type) live in NVS: `npm run factory-flash` in firebase/.
; Shared values (Firebase API key): include/project.h (git-ignored) — `node scripts/make-project-h.mjs`.
;
; Two OTA slots (app updates from GitHub Releases, src/ota.h):
;   4 MB DevKit → min_spiffs.csv (2 × 1.875 MB). PlatformIO fails the build if the binary does not fit.
;   Rev C (8 MB module) → partitions/rp_8mb.csv (2 × 3 MB), env:revc.
; Changing from huge_app.csv (no second slot) needs ONE last USB flash per existing board.
[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  mobizt/FirebaseClient@^2.2.13
  bblanchon/ArduinoJson@^7.4.3
test_ignore = test_engine, test_phe

; The binary published for OTA (scripts/release.mjs). Never contains secrets.h.
[env:release]
extends = env:esp32dev
build_flags =
  ${env:esp32dev.build_flags}
  -DRP_RELEASE

; Rev C board: ESP32 module with 8 MB flash.
[env:revc]
extends = env:esp32dev
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = partitions/rp_8mb.csv

; Over the air on the same network, for development (password = the board's PoP from NVS):
;   pio run -t upload -e ota --upload-port relaxpump-XXXXXX.local
[env:ota]
extends = env:esp32dev
upload_protocol = espota

; Host unit tests for lib/engine (needs gcc/clang on the PC):  pio test -e native
; Without PlatformIO tests:  sh scripts/test-native.sh  (any C++17 compiler, e.g. `zig c++`)
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
lib_compat_mode = off
