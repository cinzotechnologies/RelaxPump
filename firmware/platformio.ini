; RelaxPump controller firmware
[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  mobizt/FirebaseClient@^2.2.13
  bblanchon/ArduinoJson@^7.4.3

; Over the air on the same network (password = PoP from secrets.h):
;   pio run -t upload -e ota --upload-port relaxpump-XXXXXX.local
[env:ota]
extends = env:esp32dev
upload_protocol = espota
