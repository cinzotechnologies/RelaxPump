<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RelaxPump app v2 — Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Outfit:wght@300;500;600&amp;display=swap">
<style>
body{margin:0;background:#021A20}
.ph{position:relative;width:390px;height:844px;overflow:hidden;background:#021A20;color:#E8F6F7;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.ph *{box-sizing:border-box}
.ph p{margin:0}
.sc{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding:0 0 120px}
.sc::-webkit-scrollbar{display:none}
.pad{padding:56px 16px 0}
.ttl{font:500 26px/1.1 Outfit,sans-serif;letter-spacing:-.3px}
.mut{color:#8FB3B8}
.card{background:#0A242B;border-radius:22px}
.lbl{font:600 11px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#7FE3EC}
.press{transition:transform .14s cubic-bezier(.22,1,.36,1);touch-action:manipulation;cursor:pointer}
.press:active{transform:scale(.96)}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border:0;border-radius:999px;background:linear-gradient(90deg,#A8F3F8,#7FE3EC,#2FB6C6);color:#021A20;font:600 15px/1 Inter,sans-serif}
.cta[disabled]{opacity:.45;cursor:not-allowed}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:999px;border:1px solid rgba(127,227,236,.4);background:transparent;color:#7FE3EC;font:600 13px/1 Inter,sans-serif}
.seg{display:grid;height:42px;padding:4px;border-radius:999px;background:#06171C}
.seg button{border:0;border-radius:999px;background:transparent;color:#8FB3B8;font:600 13px/1 Inter,sans-serif}
.seg button.on{background:#037788;color:#FFFFFF}
.sw{position:relative;width:46px;height:28px;flex-shrink:0;border:0;padding:0;border-radius:999px;background:#2A4A50;transition:background-color .25s}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#FFFFFF;transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.sw.on{background:#037788}
.sw.on i{transform:translateX(18px)}
.nav{position:absolute;left:12px;right:12px;bottom:16px;height:62px;border-radius:22px;background:rgba(6,23,28,.96);border:1px solid rgba(3,119,136,.7);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;justify-items:center;z-index:20}
.navc{margin-top:-28px;width:54px;height:54px;border-radius:50%;background:#0A242B;border:1.5px solid #037788;display:flex;align-items:center;justify-content:center}
.fade{animation:fu .5s cubic-bezier(.22,1,.36,1) both}
@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.hdr{height:156px;padding:46px 16px 0;background:linear-gradient(160deg,#0A9AAE,#037788 55%,#035360);display:flex;align-items:flex-start;gap:10px}
.lvl{position:relative;margin:-58px 14px 0;height:132px;border-radius:24px;overflow:hidden;background:#0A242B;box-shadow:0 16px 30px -14px rgba(0,0,0,.6)}
.wv{animation:wv 6s linear infinite}.wv.b{animation-duration:9s;animation-direction:reverse}
@keyframes wv{to{transform:translateX(-84px)}}
.tile{height:64px;border-radius:16px;border:1px solid rgba(127,227,236,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font:600 10px/1 Inter,sans-serif;color:#8FB3B8}
.tile.on{background:#7FE3EC;border-color:#7FE3EC;color:#021A20;box-shadow:0 0 18px rgba(127,227,236,.35)}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:#0A242B}
.src{height:22px;padding:0 9px;border-radius:999px;font:700 10px/22px Inter,sans-serif;letter-spacing:.04em}
.s-phe{background:rgba(127,227,236,.16);color:#7FE3EC}
.s-pump{background:rgba(245,158,11,.18);color:#FCD34D}
.bar{height:8px;border-radius:8px;background:rgba(127,227,236,.12);overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#037788,#7FE3EC)}
.nos{width:38px;height:38px;border-radius:50%;border:1.5px dashed rgba(143,179,184,.5);display:flex;align-items:center;justify-content:center}

</style>
</helmet>
<div class="ph">
<div class="sc">
<div class="hdr">
<div style="width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(180deg, #FFFFFF, #E3F7F9); display: flex; align-items: center; justify-content: center"><svg width="27" height="27" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="20.5" fill="none" stroke="#1FA9B9" stroke-width="3.6" stroke-linecap="round" stroke-dasharray="96.6 128.8" transform="rotate(128 24 24)"></circle><circle cx="24" cy="24" r="13.6" fill="#EAF7F9"></circle><path d="M10.4 26q3.4-3 6.8 0t6.8 0t6.8 0t6.8 0V38H10.4z" fill="#037788"></path></svg></div>
<div style="display: flex; flex-direction: column"><span style="font-size: 11px; color: rgba(255,255,255,0.75)">Welcome back</span><span style="font-size: 15px; font-weight: 600">Rina</span></div>
<div style="margin-left: auto; position: relative; width: 36px; height: 36px; border-radius: 50%; background: rgba(2,26,32,0.25); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z M10 20a2 2 0 0 0 4 0"></path></svg><span style="position: absolute; top: 8px; right: 9px; width: 7px; height: 7px; border-radius: 50%; background: #FF7A6B"></span></div>
<div style="width: 36px; height: 36px; border-radius: 50%; padding: 2px; background: conic-gradient(#FFFFFF, #7FE3EC, #FFFFFF)"><div style="width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(180deg, #FFFFFF, #DDF6F8); color: #035360; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">RK</div></div>
</div>
<div class="lvl">
<svg width="362" height="132" viewBox="0 0 362 132" aria-hidden="true" style="position: absolute; inset: 0; overflow: visible">
<g class="wv b"><path d="M0 {{waveY}}q21-9 42 0t42 0t42 0t42 0t42 0t42 0t42 0t42 0t42 0t42 0V140H0z" fill="#204449"></path></g>
<g class="wv"><path d="M0 {{waveY2}}q21-9 42 0t42 0t42 0t42 0t42 0t42 0t42 0t42 0t42 0t42 0V140H0z" fill="#34646B"></path></g>
</svg>
<div style="position: relative; padding: 16px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 11px" class="mut">Average level · {{sensorCount}} tanks</span>
<span style="font-family: Outfit, sans-serif; font-size: 38px; font-weight: 500; line-height: 1">{{avg}}%</span>
<span style="margin-top: 12px; display: flex; gap: 8px; align-items: center; font-size: 12px; font-weight: 600"><span style="width: 7px; height: 7px; border-radius: 50%; background: #7FE3EC; box-shadow: 0 0 8px #7FE3EC"></span>{{status}}<span class="src {{srcCls}}">{{srcLabel}}</span></span>
</div>
</div>
<div class="pad" style="padding-top: 14px; display: flex; flex-direction: column; gap: 14px">
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<div class="tile on"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#021A20" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v8 M6.3 7.3a8 8 0 1 0 11.4 0"></path></svg>Pump</div>
<div class="tile"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7FE3EC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7 M20 4v4h-4"></path></svg>Auto</div>
<div class="tile"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7FE3EC" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 6c0-1.7 3.1-3 7-3s7 1.3 7 3v12c0 1.7-3.1 3-7 3s-7-1.3-7-3z"></path></svg>Tanks</div>
<div class="tile"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7FE3EC" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V10 M12 20V4 M19 20v-7"></path></svg>Usage</div>
</div>
<sc-if value="{{hasMain}}" hint-placeholder-val="{{ true }}">
<div class="card fade" style="padding: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 10px"><span class="lbl">Main tank</span><sc-if value="{{hasPhe}}" hint-placeholder-val="{{ true }}"><span class="src s-phe" style="margin-left: auto">PHE · {{pheState}}</span></sc-if></div>
<div style="display: flex; align-items: baseline; justify-content: space-between"><span style="font-family: Outfit, sans-serif; font-size: 26px; font-weight: 500">72%</span><span style="font-size: 12px" class="mut">3,600 / 5,000 L</span></div>
<div class="bar"><i style="width: 72%"></i></div>
</div>
</sc-if>
<sc-if value="{{pheNoMain}}" hint-placeholder-val="{{ false }}"><div class="card" style="padding: 12px 14px; display: flex; align-items: center; justify-content: space-between"><span style="font-size: 13px; font-weight: 600">PHE line</span><span class="src s-phe">{{pheState}}</span></div></sc-if>
<div style="display: flex; align-items: center; justify-content: space-between"><span class="lbl">Tanks · {{n}}</span><span style="font-size: 12px" class="mut">Auto · start 30% · stop 95%</span></div>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{tanks}}" as="t" hint-placeholder-count="4">
<div class="row fade" style="animation-delay: {{t.delay}}">
<sc-if value="{{t.hasSensor}}" hint-placeholder-val="{{ true }}"><svg width="38" height="38" viewBox="0 0 38 38" aria-hidden="true"><circle cx="19" cy="19" r="15" fill="none" stroke="rgba(127,227,236,0.14)" stroke-width="4"></circle><circle cx="19" cy="19" r="15" fill="none" stroke="{{t.col}}" stroke-width="4" stroke-linecap="round" stroke-dasharray="{{t.dash}}" transform="rotate(-90 19 19)"></circle></svg></sc-if>
<sc-if value="{{t.noSensor}}" hint-placeholder-val="{{ false }}"><span class="nos"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8FB3B8" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 7v6 M12 17h.01"></path></svg></span></sc-if>
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><span style="font-size: 14px; font-weight: 600">{{t.name}}</span><span style="font-size: 11px" class="mut">{{t.sub}}</span></span>
<sc-if value="{{t.hasSensor}}" hint-placeholder-val="{{ true }}"><span style="font-family: Outfit, sans-serif; font-size: 18px; font-weight: 500">{{t.pct}}%</span></sc-if>
<sc-if value="{{t.noSensor}}" hint-placeholder-val="{{ false }}"><button class="ghost press" type="button" onClick="{{t.fill}}" style="height: 34px; padding: 0 12px">{{t.fillLabel}}</button></sc-if>
</div>
</sc-for>
</div>
</div>
</div>
<div class="nav">
<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#7FE3EC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>
<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#5E7C81" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 6c0-1.7 3.1-3 7-3s7 1.3 7 3v12c0 1.7-3.1 3-7 3s-7-1.3-7-3z M5 6c0 1.7 3.1 3 7 3s7-1.3 7-3"></path></svg>
<div class="navc"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7FE3EC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7l10 10-5 4V3l5 4L7 17"></path></svg></div>
<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#5E7C81" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V10 M12 20V4 M19 20v-7"></path></svg>
<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#5E7C81" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M4 21a8 8 0 0 1 16 0"></path></svg>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tanks":{"editor":"range","min":1,"max":8,"step":1,"default":4},"phe":{"editor":"boolean","default":true},"main":{"editor":"boolean","default":true},"noSensorTank":{"editor":"int","min":0,"max":8,"default":3},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { filling: -1 }; }
  renderVals() {
    const NAMES = ['Roof', 'Kitchen', 'Bathroom', 'Garden', 'Guest', 'Office', 'Store', 'Terrace'];
    const PCTS = [82, 46, 18, 64, 90, 35, 55, 27];
    const LIT = [1000, 500, 500, 1000, 500, 1000, 1000, 500];
    const n = Math.max(1, Math.min(8, this.props.tanks ?? 4));
    const phe = this.props.phe ?? true, main = this.props.main ?? true;
    const ns = this.props.noSensorTank ?? 3;
    const tanks = Array.from({ length: n }, (_, i) => {
      const noS = (i + 1) === ns;
      const pct = PCTS[i];
      const run = this.state.filling === i;
      return {
        name: NAMES[i], pct, hasSensor: !noS, noSensor: noS, delay: (i * 40) + 'ms',
        sub: noS ? (run ? 'Filling · 10 min timer' : 'No sensor · fills by timer') : Math.round(pct * LIT[i] / 100).toLocaleString('en-IN') + ' / ' + LIT[i].toLocaleString('en-IN') + ' L',
        col: pct < 25 ? '#F59E0B' : '#7FE3EC', dash: (pct * 0.942).toFixed(1) + ' 94.2',
        fillLabel: run ? 'Stop' : 'Fill 10 min',
        fill: () => this.setState({ filling: run ? -1 : i })
      };
    });
    const withS = tanks.filter(t => t.hasSensor);
    const avg = withS.length ? Math.round(withS.reduce((a, t) => a + t.pct, 0) / withS.length) : 0;
    const low = withS.slice().sort((a, b) => a.pct - b.pct)[0];
    const y = Math.round(132 - avg * 1.0);
    return {
      n, tanks, avg, sensorCount: withS.length, waveY: y - 6, waveY2: y,
      status: low ? 'Filling ' + low.name : 'Idle',
      srcLabel: phe ? 'PHE' : 'PUMP', srcCls: phe ? 's-phe' : 's-pump',
      hasMain: main, hasPhe: phe, pheNoMain: phe && !main, pheState: 'Flowing'
    };
  }
}
</script>
</body>
</html>
