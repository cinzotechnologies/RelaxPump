<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RelaxPump app v3 — My devices + update</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Outfit:wght@300;500;600&amp;display=swap">
<style>
body{margin:0;background:#021A20}
.ph{position:relative;width:390px;height:844px;overflow:hidden;background:#021A20;color:#E8F6F7;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.ph *{box-sizing:border-box}
.ph p{margin:0}
.sc{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding:0 0 120px}
.sc::-webkit-scrollbar{display:none}
.pad{padding:56px 16px 0}
.ttl{font:500 26px/1.1 Outfit,sans-serif;letter-spacing:-.3px}
.mut{color:#8FB3B8}
.card{background:#0A242B;border-radius:22px}
.lbl{font:600 11px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#7FE3EC}
.press{transition:transform .14s cubic-bezier(.22,1,.36,1);touch-action:manipulation;cursor:pointer}
.press:active{transform:scale(.96)}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border:0;border-radius:999px;background:linear-gradient(90deg,#A8F3F8,#7FE3EC,#2FB6C6);color:#021A20;font:600 15px/1 Inter,sans-serif}
.cta[disabled]{opacity:.45;cursor:not-allowed}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:999px;border:1px solid rgba(127,227,236,.4);background:transparent;color:#7FE3EC;font:600 13px/1 Inter,sans-serif}
.seg{display:grid;height:42px;padding:4px;border-radius:999px;background:#06171C}
.seg button{border:0;border-radius:999px;background:transparent;color:#8FB3B8;font:600 13px/1 Inter,sans-serif}
.seg button.on{background:#037788;color:#FFFFFF}
.sw{position:relative;width:46px;height:28px;flex-shrink:0;border:0;padding:0;border-radius:999px;background:#2A4A50;transition:background-color .25s}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#FFFFFF;transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.sw.on{background:#037788}
.sw.on i{transform:translateX(18px)}
.nav{position:absolute;left:12px;right:12px;bottom:16px;height:62px;border-radius:22px;background:rgba(6,23,28,.96);border:1px solid rgba(3,119,136,.7);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;justify-items:center;z-index:20}
.navc{margin-top:-28px;width:54px;height:54px;border-radius:50%;background:#0A242B;border:1.5px solid #037788;display:flex;align-items:center;justify-content:center}
.fade{animation:fu .5s cubic-bezier(.22,1,.36,1) both}
@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.top{position:absolute;left:0;right:0;top:0;padding:52px 16px 12px;background:#021A20;z-index:5;display:flex;flex-direction:column;gap:12px}
.dots{display:flex;gap:6px}
.dots i{flex:1 1 0;height:4px;border-radius:4px;background:rgba(127,227,236,.15);transition:background-color .3s}
.dots i.on{background:#7FE3EC}
.body{position:absolute;left:0;right:0;top:128px;bottom:96px;overflow-y:auto;scrollbar-width:none;padding:6px 16px 20px;display:flex;flex-direction:column;gap:12px}
.foot{position:absolute;left:0;right:0;bottom:0;padding:14px 16px 26px;background:linear-gradient(180deg,rgba(2,26,32,0),#021A20 30%);display:flex;gap:10px;z-index:5}
.foot .ghost{height:52px;padding:0 22px}
.big{display:flex;align-items:center;justify-content:center;gap:28px;padding:26px 0}
.rnd{width:56px;height:56px;border-radius:50%;border:1px solid rgba(127,227,236,.4);background:transparent;color:#7FE3EC;font:500 28px/1 Inter,sans-serif}
.tk{padding:14px;border-radius:20px;background:#0A242B;display:flex;flex-direction:column;gap:12px}
.inp{height:44px;width:100%;border-radius:12px;border:1px solid rgba(127,227,236,.3);background:#06171C;color:#E8F6F7;padding:0 12px;font:500 15px Inter,sans-serif}
.inp:focus{outline:none;border-color:#7FE3EC}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.ch{height:32px;padding:0 12px;border-radius:999px;border:1px solid rgba(127,227,236,.3);background:transparent;color:#8FB3B8;font:600 12px/1 Inter,sans-serif}
.ch.on{background:#037788;border-color:#037788;color:#FFFFFF}
.trow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.port{height:22px;padding:0 8px;border-radius:6px;background:#06171C;color:#7FE3EC;font:700 11px/22px ui-monospace,monospace}
.err{padding:10px 12px;border-radius:12px;background:rgba(252,165,165,.12);color:#FCA5A5;font-size:12px;line-height:1.4}
.mini{display:flex;align-items:center;gap:10px}
.mini button{width:34px;height:34px;border-radius:50%;border:1px solid rgba(127,227,236,.4);background:transparent;color:#7FE3EC;font:600 18px/1 Inter,sans-serif}
.ok{color:#7FE3EC;font-weight:700}.bad{color:#FCA5A5;font-weight:700}
.key{height:62px;border:0;border-radius:18px;background:#0A242B;color:#E8F6F7;font:500 24px/1 Outfit,sans-serif}
.pd{width:16px;height:16px;border-radius:50%;border:1.5px solid #7FE3EC;transition:background-color .2s}
.pd.on{background:#7FE3EC}


.hdr{height:150px;padding:46px 16px 0;background:linear-gradient(160deg,#0A9AAE,#037788 55%,#035360);display:flex;align-items:flex-start;gap:10px}
.lvl{position:relative;margin:-56px 14px 0;border-radius:24px;overflow:hidden;background:#0A242B;box-shadow:0 16px 30px -14px rgba(0,0,0,.6)}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:#0A242B}
.badge{height:22px;padding:0 9px;border-radius:999px;font:700 10px/22px Inter,sans-serif;letter-spacing:.05em;white-space:nowrap}
.b-hh{background:rgba(245,158,11,.18);color:#FCD34D}
.b-phe{background:rgba(127,227,236,.16);color:#7FE3EC}
.b-open{background:rgba(52,211,153,.16);color:#6EE7B7}
.b-shut{background:rgba(143,179,184,.14);color:#8FB3B8}
.dot{width:7px;height:7px;border-radius:50%;background:#34D399;box-shadow:0 0 8px #34D399;flex-shrink:0}
.dot.off{background:#5E7C81;box-shadow:none}
.tile{height:64px;border-radius:16px;border:1px solid rgba(127,227,236,.28);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font:600 10px/1 Inter,sans-serif;color:#8FB3B8}
.tile.on{background:#7FE3EC;border-color:#7FE3EC;color:#021A20;box-shadow:0 0 18px rgba(127,227,236,.35)}
.flow{position:relative;height:6px;border-radius:6px;background:rgba(127,227,236,.12);overflow:hidden}
.flow i{position:absolute;top:0;bottom:0;width:40%;border-radius:6px;background:linear-gradient(90deg,transparent,#7FE3EC,transparent);animation:fl 1.6s linear infinite}
@keyframes fl{from{left:-40%}to{left:100%}}
.radar{position:relative;width:150px;height:150px;margin:10px auto}
.radar span{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(127,227,236,.5);animation:rd 2.4s cubic-bezier(.22,1,.36,1) infinite}
.radar span:nth-child(2){animation-delay:.8s}.radar span:nth-child(3){animation-delay:1.6s}
@keyframes rd{from{transform:scale(.25);opacity:1}to{transform:scale(1);opacity:0}}
.radar b{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:#037788;display:flex;align-items:center;justify-content:center}
.dev{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:18px;border:1px solid rgba(127,227,236,.22);background:#0A242B;color:#E8F6F7;text-align:left;font:inherit}
.ico{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ico.hh{background:rgba(245,158,11,.16)}.ico.phe{background:rgba(127,227,236,.14)}
.chk{display:flex;align-items:center;gap:10px;font-size:14px}
.chk i{width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(127,227,236,.35);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;color:#021A20;transition:background-color .3s}
.chk i.on{background:#7FE3EC;border-color:#7FE3EC}
.prog{height:8px;border-radius:8px;background:rgba(127,227,236,.12);overflow:hidden}
.prog i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#037788,#7FE3EC);transition:width .6s cubic-bezier(.22,1,.36,1)}
.back{width:36px;height:36px;border-radius:50%;border:1px solid rgba(127,227,236,.3);background:transparent;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div class="ph">
<sc-if value="{{isList}}" hint-placeholder-val="{{ true }}">
<div class="sc"><div class="pad fade" style="display: flex; flex-direction: column; gap: 14px">
<span class="ttl">My devices</span>
<sc-for list="{{devices}}" as="d" hint-placeholder-count="2">
<button class="dev press" type="button" onClick="{{d.open}}"><span class="ico {{d.icoCls}}"><sc-if value="{{d.isHH}}" hint-placeholder-val="{{ true }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FCD34D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7 M5 10v10h14V10 M10 20v-5h4v5"></path></svg></sc-if><sc-if value="{{d.isPHE}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7FE3EC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9h8v6H2 M10 12h6 M16 7v10 M16 12h3c1.7 0 3 1.3 3 3v2"></path></svg></sc-if></span><span style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1"><b style="font-size: 15px">{{d.name}}</b><span style="display: flex; align-items: center; gap: 6px; font-size: 12px" class="mut"><span class="dot"></span>Online · v{{d.fw}}</span></span><sc-if value="{{d.upd}}" hint-placeholder-val="{{ true }}"><span class="badge b-open">UPDATE</span></sc-if></button>
</sc-for>
<button class="ghost press" type="button" style="height: 48px">+ Add device</button>
</div></div>
</sc-if>

<sc-if value="{{isDetail}}" hint-placeholder-val="{{ false }}">
<div class="sc"><div class="pad fade" style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 10px"><button class="back press" type="button" aria-label="Back" onClick="{{toList}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7FE3EC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button><span class="ttl">{{cur.name}}</span></div>
<div class="tk"><span class="lbl">Device</span>
<div class="trow"><span class="mut">Type</span><span style="display: flex; align-items: center; gap: 8px"><span class="badge {{cur.badgeCls}}">{{cur.badge}}</span></span></div>
<div class="trow"><span class="mut">ID</span><b>{{cur.id}}</b></div>
<div class="trow"><span class="mut">Wi-Fi</span><b>Rina-Home · good</b></div>
<div class="trow"><span class="mut">Firmware</span><b>v{{fwNow}}</b></div>
<p style="font-size: 12px" class="mut">The type is set at the factory and cannot be changed.</p>
</div>

<div class="tk">
<div class="trow"><span class="lbl">Software update</span><sc-if value="{{upToDate}}" hint-placeholder-val="{{ false }}"><span class="ok">Up to date ✓</span></sc-if></div>
<sc-if value="{{hasUpd}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 10px">
<div class="trow"><b style="font-size: 16px">Version {{fwNew}}</b><span class="mut" style="font-size: 12px">1.6 MB</span></div>
<sc-for list="{{notes}}" as="n" hint-placeholder-count="3"><span style="display: flex; gap: 8px; font-size: 13px; line-height: 1.4"><span style="color: #7FE3EC">•</span><span class="mut">{{n.t}}</span></span></sc-for>
<sc-if value="{{busy}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; gap: 8px"><div class="prog"><i style="width: {{pW}}"></i></div><span style="font-size: 12px" class="mut">{{phase}}</span></div></sc-if>
<sc-if value="{{idle}}" hint-placeholder-val="{{ true }}"><button class="cta press" type="button" onClick="{{update}}" disabled="{{blocked}}">{{updLabel}}</button></sc-if>
<p style="font-size: 12px; line-height: 1.5" class="mut">{{updHelp}}</p>
</div>
</sc-if>
</div>

<div class="tk"><span class="lbl">Setup</span>
<div class="trow"><span>{{cur.layout}}</span><button class="ghost press" type="button" style="height: 32px; padding: 0 12px">Installer setup</button></div>
</div>
<button class="ghost press" type="button" style="height: 48px; border-color: rgba(252,165,165,0.45); color: #FCA5A5">Remove from my account</button>
</div></div>
</sc-if>
<div class="nav">
<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#5E7C81" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>
<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#5E7C81" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 6c0-1.7 3.1-3 7-3s7 1.3 7 3v12c0 1.7-3.1 3-7 3s-7-1.3-7-3z M5 6c0 1.7 3.1 3 7 3s7-1.3 7-3"></path></svg>
<div class="navc"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7FE3EC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7l10 10-5 4V3l5 4L7 17"></path></svg></div>
<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#5E7C81" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V10 M12 20V4 M19 20v-7"></path></svg>
<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#7FE3EC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M4 21a8 8 0 0 1 16 0"></path></svg>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"updateAvailable":{"editor":"boolean","default":true},"pumpRunning":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { view: 'list', cur: 0, p: 0, done: {} }; this.t = []; }
  componentWillUnmount() { this.t.forEach(clearTimeout); }
  run() { [1, 2, 3, 4, 5].forEach(k => this.t.push(setTimeout(() => this.setState(k === 5 ? { p: 0, done: { ...this.state.done, [this.state.cur]: true } } : { p: k }), k * 900))); this.setState({ p: 0.5 }); }
  renderVals() {
    const s = this.state;
    const upd = this.props.updateAvailable ?? true, running = this.props.pumpRunning ?? false;
    const D = [
      { id: 'RP-3F2A9C', name: 'Household', type: 'hh', fw: '2.3.0', layout: '3 semi tanks · main tank sensor' },
      { id: 'RP-D4E5F6', name: 'PHE', type: 'phe', fw: '3.0.0', layout: '2 PHE lines' }];
    const deco = (d, i) => ({ ...d, isHH: d.type === 'hh', isPHE: d.type === 'phe', icoCls: d.type, badge: d.type === 'hh' ? 'HOUSEHOLD' : 'PHE', badgeCls: d.type === 'hh' ? 'b-hh' : 'b-phe',
      fw: s.done[i] ? '3.1.0' : d.fw, upd: upd && !s.done[i] });
    const devices = D.map((d, i) => ({ ...deco(d, i), open: () => this.setState({ view: 'detail', cur: i }) }));
    const cur = devices[s.cur];
    const PH = ['', 'Downloading… 40%', 'Downloading… 100% · checking signature', 'Installing · pump off, valves closed', 'Restarting…'];
    const busy = s.p > 0;
    return {
      isList: s.view === 'list', isDetail: s.view === 'detail', devices, cur, toList: () => this.setState({ view: 'list' }),
      fwNow: cur.fw, fwNew: '3.1.0', hasUpd: cur.upd, upToDate: !cur.upd,
      notes: [{ t: 'Faster Wi-Fi reconnect after a power cut' }, { t: 'PHE: shows when PHE water starts and stops' }, { t: 'Bug fixes' }],
      busy, idle: !busy, pW: Math.min(100, s.p * 25) + '%', phase: PH[Math.floor(s.p)] || 'Starting…',
      blocked: running && cur.isHH, updLabel: running && cur.isHH ? 'Wait — the pump is running' : 'Update now', update: () => this.run(),
      updHelp: 'About 2 minutes. The pump stops and every valve closes during the update. If anything goes wrong the board goes back to the old version by itself.'
    };
  }
}
</script>
</body>
</html>
